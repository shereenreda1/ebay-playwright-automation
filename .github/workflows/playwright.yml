name: Playwright Tests & Report

on:
  push:
    branches: [feature/my-improvements, main, master]
  pull_request:
    branches: [feature/my-improvements, main, master]

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # 1. Upload the Playwright report directory as an artifact
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() # Ensures the report is uploaded even if some tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Optional job to deploy directly to GitHub Pages
  deploy-pages:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/my-improvements')
    runs-on: ubuntu-latest
    steps:
      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
